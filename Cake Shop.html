<script>
// Scroll reveal observer
function initReveal() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('animate', 'visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });

  function observe() {
    document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => {
      if (!el.classList.contains('visible')) {
        const rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight && rect.bottom > 0) {
          el.classList.add('visible');
        } else {
          el.classList.add('animate');
          io.observe(el);
        }
      }
    });
  }

  // Run after React has had time to render
  setTimeout(observe, 100);
  setTimeout(observe, 400);

  // Also re-run on React re-renders via MutationObserver
  new MutationObserver(() => setTimeout(observe, 100))
    .observe(document.body, { childList: true, subtree: true });

  window.addEventListener('scroll', observe, { passive: true });

  // Nav shadow
  window.addEventListener('scroll', () => {
    const nav = document.querySelector('nav');
    if (nav) nav.classList.toggle('nav-scrolled', window.scrollY > 10);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initReveal);
} else {
  initReveal();
}
</script>

  };

  React.useEffect(() => {
    document.body.classList.add('home-bg');
    return () => document.body.classList.remove('home-bg');
  }, []);

  const navigate = (p) => {
    if (p === 'Home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      const id = p.toLowerCase().replace(/\s+/g, '-');
      const el = document.getElementById(id);
      if (el) {
        const navHeight = 64;
        const top = el.getBoundingClientRect().top + window.scrollY - navHeight;
        window.scrollTo({ top, behavior: 'smooth' });
      }
    }
  };

  // Track which section is currently in view
  React.useEffect(() => {
    const sections = ['menu', 'customized', 'about', 'reminders'];
    const onScroll = () => {
      const scroll = window.scrollY + 200;
      let current = 'Home';
      for (const id of sections) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= scroll) {
          current = id.charAt(0).toUpperCase() + id.slice(1);
        }
      }
      setPage(current);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Nav currentPage={page} onNavigate={navigate} cartCount={0} />

            {SPECIALS.map((p, i) =>
            <div key={p.id} className={`reveal reveal-delay-${i + 1}`}>
              <ProductCard product={p} onAddToCart={() => window.open('https://m.me/YhanasCakesandPastries', '_blank')} wishlist={wishlist} onToggleWishlist={handleToggleWishlist} />
            </div>
            )}
          </div>
        </section>
        <div id="menu"><MenuPage onAddToCart={() => window.open('https://m.me/YhanasCakesandPastries', '_blank')} wishlist={wishlist} onToggleWishlist={handleToggleWishlist} /></div>
        <div id="customized"><CustomizedPage /></div>
        <HowToOrder onOrder={() => window.open('https://m.me/YhanasCakesandPastries', '_blank')} />
        <div id="about"><AboutPage /></div>
        <div id="reminders"><RemindersPage /></div>
        <Testimonials />
      </main>
      <Footer onNavigate={navigate} />
    </div>);

};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<div id="root"></div>
</body>
</html>
