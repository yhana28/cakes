<script>
// Scroll reveal observer
function initReveal() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('animate', 'visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });

  function observe() {
    document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => {
      if (!el.classList.contains('visible')) {
        const rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight && rect.bottom > 0) {
          el.classList.add('visible');
        } else {
          el.classList.add('animate');
          io.observe(el);
        }
      }
    });
  }

  setTimeout(observe, 100);
  setTimeout(observe, 400);

  new MutationObserver(() => setTimeout(observe, 100))
    .observe(document.body, { childList: true, subtree: true });

  window.addEventListener('scroll', observe, { passive: true });

  window.addEventListener('scroll', () => {
    const nav = document.querySelector('nav');
    if (nav) nav.classList.toggle('nav-scrolled', window.scrollY > 10);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initReveal);
} else {
  initReveal();
}
</script>

// ─── Gallery Lightbox ─────────────────────────────────────────────────────────
const GalleryLightbox = ({ images, initialIndex, onClose }) => {
  const [index, setIndex] = React.useState(initialIndex);
  const [closing, setClosing] = React.useState(false);
  const [imgKey, setImgKey] = React.useState(0);
  const { isMobile } = useResponsive();

  const handleClose = React.useCallback(() => {
    if (closing) return;
    setClosing(true);
    setTimeout(onClose, 350);
  }, [closing, onClose]);

  const goNext = (e) => { e.stopPropagation(); setIndex(i => (i + 1) % images.length); setImgKey(k => k + 1); };
  const goPrev = (e) => { e.stopPropagation(); setIndex(i => (i - 1 + images.length) % images.length); setImgKey(k => k + 1); };

  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === 'Escape') handleClose();
      if (e.key === 'ArrowRight') { setIndex(i => (i + 1) % images.length); setImgKey(k => k + 1); }
      if (e.key === 'ArrowLeft')  { setIndex(i => (i - 1 + images.length) % images.length); setImgKey(k => k + 1); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [handleClose, images.length]);

  React.useEffect(() => {
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = ''; };
  }, []);

  const img = images[index];

  return ReactDOM.createPortal(
    <div
      style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.88)', backdropFilter: 'blur(10px)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: isMobile ? '60px 16px 40px' : '60px 80px 40px', animation: closing ? 'modalBgOut 0.35s ease forwards' : 'modalBgIn 0.25s ease', fontFamily: "'Nunito', sans-serif" }}
      onClick={handleClose}
    >
      {/* Counter */}
      <div style={{ position: 'absolute', top: '20px', left: '50%', transform: 'translateX(-50%)', color: 'rgba(255,255,255,0.55)', fontSize: '12px', fontWeight: 600, letterSpacing: '0.1em', whiteSpace: 'nowrap' }}>
        {index + 1} <span style={{ opacity: 0.4 }}>/</span> {images.length}
      </div>

      {/* Close */}
      <button onClick={handleClose}
        style={{ position: 'absolute', top: '16px', right: '20px', background: 'rgba(255,255,255,0.1)', border: '1.5px solid rgba(255,255,255,0.2)', borderRadius: '50%', width: '40px', height: '40px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#fff', fontSize: '20px', lineHeight: 1, transition: 'background 0.2s', backdropFilter: 'blur(4px)' }}
        onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.22)'}
        onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.1)'}
      >×</button>

      {/* Image + label */}
      <div key={imgKey} className="lightbox-img-enter"
        style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', maxWidth: '820px', width: '100%', animation: closing ? 'modalOut 0.35s cubic-bezier(.22,1,.36,1) forwards' : undefined }}
        onClick={e => e.stopPropagation()}
      >
        <img src={img.img} alt={img.label}
          style={{ maxWidth: '100%', maxHeight: isMobile ? '60vh' : '72vh', objectFit: 'contain', borderRadius: '14px', boxShadow: '0 32px 80px rgba(0,0,0,0.6)', display: 'block' }}
          onError={e => { e.currentTarget.src = 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800&q=80&auto=format&fit=crop'; }}
        />
        <div style={{ marginTop: '18px', textAlign: 'center' }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: isMobile ? '16px' : '20px', fontWeight: 700, color: '#fff', marginBottom: '6px' }}>{img.label}</div>
          <a href="https://m.me/YhanasCakesandPastries" target="_blank" rel="noopener noreferrer"
            style={{ fontSize: '11px', fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#e8432a', textDecoration: 'none', background: 'rgba(232,67,42,0.12)', padding: '6px 16px', borderRadius: '999px', border: '1px solid rgba(232,67,42,0.3)', transition: 'background 0.2s' }}
            onClick={e => e.stopPropagation()}
          >ORDER THIS DESIGN →</a>
        </div>
      </div>

      {/* Prev / Next */}
      {images.length > 1 && (
        <>
          <button className="lb-nav" onClick={goPrev} style={{ left: isMobile ? '8px' : '20px' }}>‹</button>
          <button className="lb-nav" onClick={goNext} style={{ right: isMobile ? '8px' : '20px' }}>›</button>
        </>
      )}

      {/* Dot indicators */}
      {images.length > 1 && (
        <div style={{ position: 'absolute', bottom: '20px', left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: '6px' }}>
          {images.map((_, i) =>
            <button key={i} onClick={e => { e.stopPropagation(); setIndex(i); setImgKey(k => k + 1); }}
              style={{ width: i === index ? '20px' : '7px', height: '7px', borderRadius: '9999px', border: 'none', cursor: 'pointer', padding: 0, background: i === index ? '#e8432a' : 'rgba(255,255,255,0.35)', transition: 'all 0.25s' }}
            />
          )}
        </div>
      )}
    </div>,
    document.body
  );
};

// ─── App ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = React.useState('Home');
  const [wishlist, setWishlist] = React.useState([1]);
  const { isMobile, width } = useResponsive();

  const handleToggleWishlist = (id) => {
    setWishlist((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  };

  React.useEffect(() => {
    document.body.classList.add('home-bg');
    return () => document.body.classList.remove('home-bg');
  }, []);

  const navigate = (p) => {
    if (p === 'Home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      const id = p.toLowerCase().replace(/\s+/g, '-');
      const el = document.getElementById(id);
      if (el) {
        const top = el.getBoundingClientRect().top + window.scrollY - 64;
        window.scrollTo({ top, behavior: 'smooth' });
      }
    }
  };

  React.useEffect(() => {
    const sections = ['menu', 'customized', 'about', 'reminders'];
    const onScroll = () => {
      const scroll = window.scrollY + 200;
      let current = 'Home';
      for (const id of sections) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= scroll) {
          current = id.charAt(0).toUpperCase() + id.slice(1);
        }
      }
      setPage(current);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Nav currentPage={page} onNavigate={navigate} cartCount={0} />
      <main style={{ flex: 1 }}>
        <Hero onOrder={() => navigate('Menu')} onMenu={() => navigate('Menu')} />
        <section style={{ padding: isMobile ? '48px 16px 56px' : (width < 960 ? '72px 40px 80px' : '72px 80px 80px'), background: '#fae8d5' }}>
          <div className="reveal" style={{ textAlign: 'center', marginBottom: '40px' }}>
            <div style={{ fontSize: '11px', fontWeight: 800, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#e8432a', marginBottom: '10px' }}>This Week's Specials</div>
            <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: isMobile ? '26px' : '34px', fontWeight: 700, color: '#1a1a1a', marginBottom: '10px' }}>Our Most Loved Cakes</h2>
            <p style={{ fontSize: '14px', color: '#777' }}>Try our most popular signature cakes and taste the difference!</p>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fill, minmax(240px, 1fr))', gap: '20px' }}>
            {SPECIALS.map((p, i) =>
            <div key={p.id} className={`reveal reveal-delay-${i + 1}`} style={{ minWidth: 0 }}>
              <ProductCard product={p} onAddToCart={() => window.open('https://m.me/YhanasCakesandPastries', '_blank')} wishlist={wishlist} onToggleWishlist={handleToggleWishlist} />
            </div>
            )}
          </div>
        </section>
        <div id="menu"><MenuPage onAddToCart={() => window.open('https://m.me/YhanasCakesandPastries', '_blank')} wishlist={wishlist} onToggleWishlist={handleToggleWishlist} /></div>
        <div id="customized"><CustomizedPage /></div>
        <HowToOrder onOrder={() => window.open('https://m.me/YhanasCakesandPastries', '_blank')} />
        <div id="about"><AboutPage /></div>
        <div id="reminders"><RemindersPage /></div>
        <Testimonials />
      </main>
      <Footer onNavigate={navigate} />
    </div>);
};
